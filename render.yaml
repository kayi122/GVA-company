# Render Blueprint — creates the GVA Sales Pipeline web service with a persistent disk.
# Render dashboard → New → Blueprint → pick this repository. See RENDER.md.
services:
  - type: web
    name: gva-sales-pipeline
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # a persistent disk needs a paid plan; on the free plan all data is lost on restart
    region: frankfurt # closest Render region to Rwanda
    branch: main
    autoDeploy: true # every push to main redeploys
    healthCheckPath: /api/health
    disk:
      name: gva-data
      mountPath: /data # database, photos and backups
      sizeGB: 1
    envVars:
      - key: PORT
        value: "4000"
      - key: TZ
        value: Africa/Kigali
      - key: JWT_SECRET
        generateValue: true # Render creates a long random secret
      # --- you are asked for these when you create the Blueprint ---
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
