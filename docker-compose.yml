# GVA Sales Pipeline: the app + Caddy (automatic HTTPS certificate for your domain).
# 1. cp .env.production.example .env.production   and fill it in
# 2. docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - gva-data:/data # database, photos and backups live here
    expose:
      - "4000"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    env_file: .env.production # provides DOMAIN
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  gva-data:
  caddy-data:
  caddy-config:
